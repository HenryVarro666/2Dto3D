<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="632" viewBox="0 0 1120 632" role="img" aria-labelledby="title desc">
<title id="title">独立真实场景 · 四方案同点比较</title><desc id="desc">E10-M: four frozen policies on three real ETH3D scenes; separate held-out and cross-wall aggregates, all regressions retained in the report.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#72a18b"/></marker></defs>
<rect width="1120" height="632" rx="20" fill="#f4f7f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="32" y="45" font-size="25" fill="#244a45" font-weight="650" text-anchor="start">独立真实场景 · 四方案同点比较</text><text x="32" y="75" font-size="14" fill="#678077" font-weight="400" text-anchor="start">办公室、卸货区、材料走廊 · 9张实景图 · VGGT518 · 仅A–B标定</text><rect x="32" y="98" width="526" height="308" rx="14" fill="#fff" stroke="#d7e3da"/><text x="50" y="129" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">全部检查线 MAPE · n=12</text><text x="50" y="169" font-size="13" fill="#244a45" font-weight="400" text-anchor="start">原图 / 14对齐</text><rect x="223" y="154" width="238.733" height="24" rx="4" fill="#6c7d73"/><text x="468.733298738416" y="171" font-size="14" fill="#6c7d73" font-weight="650" text-anchor="start">3.100%</text><text x="50" y="222" font-size="13" fill="#244a45" font-weight="400" text-anchor="start">原图 / 保比例</text><rect x="223" y="207" width="180.900" height="24" rx="4" fill="#aa7b38"/><text x="410.8998806660083" y="224" font-size="14" fill="#aa7b38" font-weight="650" text-anchor="start">2.349%</text><text x="50" y="275" font-size="13" fill="#244a45" font-weight="400" text-anchor="start">去畸变 / 14对齐</text><rect x="223" y="260" width="220.200" height="24" rx="4" fill="#366277"/><text x="450.20038068693697" y="277" font-size="14" fill="#366277" font-weight="650" text-anchor="start">2.860%</text><text x="50" y="328" font-size="13" fill="#244a45" font-weight="400" text-anchor="start">去畸变 / 保比例</text><rect x="223" y="313" width="185.360" height="24" rx="4" fill="#247e6b"/><text x="415.36003939138317" y="330" font-size="14" fill="#247e6b" font-weight="650" text-anchor="start">2.407%</text><text x="50" y="390" font-size="12" fill="#678077" font-weight="400" text-anchor="start">横轴共用0–4%；越小越好</text><rect x="582" y="98" width="526" height="308" rx="14" fill="#fff" stroke="#d7e3da"/><text x="600" y="129" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">跨墙检查线 MAPE · n=4</text><text x="600" y="169" font-size="13" fill="#244a45" font-weight="400" text-anchor="start">原图 / 14对齐</text><rect x="773" y="154" width="206.652" height="24" rx="4" fill="#6c7d73"/><text x="986.6515056268975" y="171" font-size="14" fill="#6c7d73" font-weight="650" text-anchor="start">2.684%</text><text x="600" y="222" font-size="13" fill="#244a45" font-weight="400" text-anchor="start">原图 / 保比例</text><rect x="773" y="207" width="108.273" height="24" rx="4" fill="#aa7b38"/><text x="888.2733273247821" y="224" font-size="14" fill="#aa7b38" font-weight="650" text-anchor="start">1.406%</text><text x="600" y="275" font-size="13" fill="#244a45" font-weight="400" text-anchor="start">去畸变 / 14对齐</text><rect x="773" y="260" width="179.995" height="24" rx="4" fill="#366277"/><text x="959.9948265657297" y="277" font-size="14" fill="#366277" font-weight="650" text-anchor="start">2.338%</text><text x="600" y="328" font-size="13" fill="#244a45" font-weight="400" text-anchor="start">去畸变 / 保比例</text><rect x="773" y="313" width="82.514" height="24" rx="4" fill="#247e6b"/><text x="862.5139523980592" y="330" font-size="14" fill="#247e6b" font-weight="650" text-anchor="start">1.072%</text><text x="600" y="390" font-size="12" fill="#678077" font-weight="400" text-anchor="start">横轴共用0–4%；越小越好</text><text x="32" y="445" font-size="20" fill="#244a45" font-weight="650" text-anchor="start">平均改善，仍有退步</text><text x="32" y="478" font-size="14" fill="#986a23" font-weight="400" text-anchor="start">去畸变：8条改善 / 4条退步。卸货区GH约145mm、IJ约114mm绝对误差。</text><text x="32" y="507" font-size="14" fill="#986a23" font-weight="400" text-anchor="start">材料走廊：EF仍7.702%；137mm短线IJ从5.313%退步至6.738%。</text><text x="32" y="536" font-size="14" fill="#59756a" font-weight="400" text-anchor="start">原图保比例2.349%，略低于去畸变保比例2.407%；不能把增加预处理当作必然提升。</text><text x="32" y="565" font-size="14" fill="#59756a" font-weight="400" text-anchor="start">仅3个新场景；4条跨墙线来自其中2个场景。24次含复跑，不增加独立样本。</text><text x="32" y="594" font-size="14" fill="#59756a" font-weight="400" text-anchor="start">旧kicker反例保留，产品默认未改。独立于项目调试，不保证独立于VGGT预训练。</text></g></svg>
