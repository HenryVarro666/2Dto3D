<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
<title id="title">比例校准成功，也需要独立检查形状</title><desc id="desc">Analytic example: one calibrated reference and two held-out checks; a ten percent height distortion remains</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#72a18b"/></marker></defs>
<rect width="1120" height="390" rx="20" fill="#f4f7f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="32" y="45" font-size="25" fill="#244a45" font-weight="650" text-anchor="start">比例校准成功，也需要独立检查形状</text><rect x="28" y="78" width="484" height="286" rx="14" fill="#fff" stroke="#d7e3da"/><rect x="536" y="78" width="558" height="286" rx="14" fill="#fff" stroke="#d7e3da"/><text x="50" y="112" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">标定参照 A–B</text><path d="M110,160 L355,160 L355,275 L110,275 Z" fill="#e1ede5" stroke="#79a68d" stroke-width="2"/><circle cx="110" cy="275" r="6" fill="#b9892d"/><circle cx="355" cy="275" r="6" fill="#b9892d"/><text x="101" y="264" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">A</text><text x="348" y="264" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">B</text><text x="232" y="198" font-size="20" fill="#244a45" font-weight="600" text-anchor="middle">2.0000 u = 200 mm</text><text x="232" y="231" font-size="17" fill="#244a45" font-weight="400" text-anchor="middle">s = 200 / 2 = 100 mm/u</text><text x="50" y="337" font-size="14" fill="#678077" font-weight="400" text-anchor="start">只有 A–B 参与求比例</text><text x="560" y="112" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">未参与标定的长度</text><text x="560" y="153" font-size="15" fill="#244a45" font-weight="650" text-anchor="start">C–D</text><text x="634" y="153" font-size="19" fill="#244a45" font-weight="400" text-anchor="start">3.3 u × 100 = 330 mm</text><text x="634" y="184" font-size="15" fill="#986a23" font-weight="400" text-anchor="start">独立依据 300 mm → 误差 30 mm / 10%</text><text x="560" y="231" font-size="15" fill="#244a45" font-weight="650" text-anchor="start">E–F</text><text x="634" y="231" font-size="19" fill="#244a45" font-weight="400" text-anchor="start">1.2 u × 100 = 120 mm</text><text x="634" y="262" font-size="15" fill="#21836c" font-weight="400" text-anchor="start">独立依据 120 mm → 误差约 0</text><text x="560" y="337" font-size="14" fill="#678077" font-weight="400" text-anchor="start">刻意构造的非均匀形变；不是现场精度结果。</text></g></svg>
