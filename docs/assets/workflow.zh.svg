<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="369" viewBox="0 0 1120 369" role="img" aria-labelledby="title desc">
<title id="title">从照片到有依据的尺寸</title><desc id="desc">Workflow showing multi-view input, local models, component cloud and scale validation</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#72a18b"/></marker></defs>
<rect width="1120" height="369" rx="20" fill="#f4f7f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="32" y="45" font-size="25" fill="#244a45" font-weight="650" text-anchor="start">从照片到有依据的尺寸</text><text x="32" y="73" font-size="13" fill="#678077" font-weight="400" text-anchor="start">当前实现 · 全部本地运行</text><rect x="28" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="46" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">01</text><text x="46" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">同一设备 · 2–8 个视角</text><text x="46" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">重叠、清晰、设备保持静止</text><text x="46" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">输入与照片 SHA256</text><path d="M278,191 L296,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="302" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="320" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">02</text><text x="320" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">联合几何 + 组件区域</text><text x="320" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">VGGT · Grounding DINO · SAM</text><text x="320" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">相机、深度、逐图观察</text><path d="M552,191 L570,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="594" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">03</text><text x="594" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">彩色点云与人工校正</text><text x="594" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">全局组件 ID · 原始坐标</text><text x="594" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">选择、隔离、修正、导出</text><path d="M826,191 L844,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="868" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">04</text><text x="868" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">参照标定与独立验证</text><text x="868" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">已知长度 → 比例 → 两点距离</text><text x="868" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">记录来源、绝对 / 相对误差</text><rect x="28" y="301" width="1066" height="44" rx="8" fill="#e4efe6" stroke="none"/><text x="48" y="328" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">单图保留结构示意；校准只改变比例，不能恢复遮挡或修正形变。</text></g></svg>
