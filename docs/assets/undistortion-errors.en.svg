start">0.19%</text><rect x="340" y="299" width="23.98" height="9" rx="3" fill="#247e6b"/><text x="369.98349950255704" y="308" font-size="12" fill="#247e6b" font-weight="400" text-anchor="start">0.56%</text><text x="32" y="342" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">kicker · Back wall C-D</text><rect x="340" y="328" width="552.36" height="9" rx="3" fill="#bd8a48"/><text x="898.3557226163548" y="337" font-size="12" fill="#bd8a48" font-weight="400" text-anchor="start">12.85%</text><rect x="340" y="341" width="179.62" height="9" rx="3" fill="#247e6b"/><text x="525.6201903059901" y="350" font-size="12" fill="#247e6b" font-weight="400" text-anchor="start">4.18%</text><text x="32" y="384" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">kicker · Side wall E-F</text><rect x="340" y="370" width="72.39" height="9" rx="3" fill="#bd8a48"/><text x="418.39498659646085" y="379" font-size="12" fill="#bd8a48" font-weight="400" text-anchor="start">1.68%</text><rect x="340" y="383" width="122.56" height="9" rx="3" fill="#247e6b"/><text x="468.55709040083315" y="392" font-size="12" fill="#247e6b" font-weight="400" text-anchor="start">2.85%</text><text x="32" y="426" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">kicker · Back wall to side wall G-H</text><rect x="340" y="412" width="510.14" height="9" rx="3" fill="#bd8a48"/><text x="856.1390750283731" y="421" font-size="12" fill="#bd8a48" font-weight="400" text-anchor="start">11.86%</text><rect x="340" y="425" width="555.10" height="9" rx="3" fill="#247e6b"/><text x="901.1030888506868" y="434" font-size="12" fill="#247e6b" font-weight="400" text-anchor="start">12.91%</text><text x="32" y="468" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">kicker · Cabinet lower span I-J</text><rect x="340" y="454" width="2.62" height="9" rx="3" fill="#bd8a48"/><text x="348.62483442215904" y="463" font-size="12" fill="#bd8a48" font-weight="400" text-anchor="start">0.06%</text><rect x="340" y="467" width="11.28" height="9" rx="3" fill="#247e6b"/><text x="357.28205467987533" y="476" font-size="12" fill="#247e6b" font-weight="400" text-anchor="start">0.26%</text><text x="32" y="535" font-size="13" fill="#986a23" font-weight="400" text-anchor="start">Back-wall depth order remains wrong. Cross-wall error: 11.86%→12.91% (~690 mm). Scale cannot repair shape.</text><text x="32" y="562" font-size="12" fill="#59756a" font-weight="400" text-anchor="start">Rectification needs known calibration; scan truth is withheld. Subpixel sampling differs from E07. Field accuracy is unverified.</text></g></svg>
