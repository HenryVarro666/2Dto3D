<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="505" viewBox="0 0 1120 505" role="img" aria-labelledby="title desc">
<title id="title">Architecture &amp; evidence flow</title><desc id="desc">Local web, API and storage above bounded perception queue and isolated geometry worker</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#72a18b"/></marker></defs>
<rect width="1120" height="505" rx="20" fill="#f4f7f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="32" y="45" font-size="25" fill="#244a45" font-weight="650" text-anchor="start">Architecture &amp; evidence flow</text><rect x="28" y="83" width="290" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="48" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Web workbench</text><text x="48" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">React · TypeScript · Three.js</text><text x="48" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Photos, edits, components &amp; raw picks</text><text x="48" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">中文 / English / Español</text><rect x="400" y="83" width="320" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="420" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Local API</text><text x="420" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">FastAPI · Pydantic</text><text x="420" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Jobs, one inference queue &amp; receipts</text><text x="420" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Measurements read GLB; no inference</text><rect x="803" y="83" width="290" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="823" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Durable evidence</text><text x="823" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">SQLite + local files</text><text x="823" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Hashes, versions, indices &amp; coordinates</text><text x="823" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">GLB / PLY / JSON + error receipts</text><path d="M323,165 L390,165" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><path d="M725,165 L793,165" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="300" width="510" height="140" rx="14" fill="#e9f1e9" stroke="#d7e3da"/><text x="48" y="333" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Perception models</text><text x="48" y="365" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Grounding DINO tiny + SAM 2.1 tiny</text><text x="48" y="390" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Single schematics, per-view recognition &amp; mask refinement</text><rect x="585" y="300" width="508" height="140" rx="14" fill="#e9f1e9" stroke="#d7e3da"/><text x="605" y="333" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Isolated multi-view worker</text><text x="605" y="365" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">VGGT-1B · separate Python / NumPy 1.x lock</text><text x="605" y="390" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Joint cameras &amp; depth → shared frame → component-aware fusion</text><path d="M505,253 L283,289" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><path d="M614,253 L839,289" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="478" font-size="13" fill="#678077" font-weight="400" text-anchor="start">All model jobs share one bounded executor. Raw data stay out of Git. No external inference API.</text></g></svg>
