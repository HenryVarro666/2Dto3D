[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-structure-workbench"
version = "3.0.0"
description = "Local PV photo recognition, multiview point fusion and editable 3D workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1", "pillow>=11,<13", "numpy>=2,<3",
  "trimesh>=4.6,<5", "scipy>=1.15,<2",
  "opencv-python-headless>=4.11,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.13,<1", "mypy>=1.14,<3"]
ml = [
  "torch>=2.8,<2.9", "torchvision>=0.23,<0.24",
  "transformers>=4.57,<4.58", "huggingface-hub>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps", "models", "data", "artifacts"]

[tool.ruff.lint]
# Explicit set so results do not drift with ruff's defaults: pycodestyle/pyflakes
# plus import order, bugbear and modern-syntax checks.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) would change behavior inside frozen numeric paths.

[tool.ruff.lint.per-file-ignores]
# Benchmark scripts are hash-bound by frozen measurement records; style edits would break their audit trail.
"scripts/*" = ["E701", "E702", "E731"]
"services/api/tests/*" = ["E702"]

[tool.mypy]
python_version = "3.12"
files = ["services/api/src/pv3d"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
