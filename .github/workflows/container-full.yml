name: Full-model container (manual)

# Builds the image variant that bundles the perception stack and the isolated VGGT
# worker environment. It downloads multi-GB PyTorch wheels, so it runs only on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for CUDA wheels
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build (WITH_MODELS=1)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pv3d:full
          build-args: |
            WITH_MODELS=1
      - name: Worker environment is importable inside the image
        run: |
          docker run --rm pv3d:full services/multiview/.venv/bin/python -c "import vggt, torch, numpy; print(torch.__version__, numpy.__version__)"
          docker run --rm pv3d:full /app/.venv/bin/python -c "import torch, transformers; print(torch.__version__, transformers.__version__)"
