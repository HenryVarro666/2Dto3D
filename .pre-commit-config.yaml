# Local hooks reuse the project's pinned tools; install with `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
        files: ^(services/api|scripts|services/multiview/infer\.py)
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        files: ^services/api/src/
      - id: prettier
        name: prettier --check (apps/web)
        entry: npm --prefix apps/web run lint --
        language: system
        pass_filenames: false
        files: ^apps/web/
      - id: no-large-binaries
        name: refuse accidental photo/weight commits
        entry: bash -c 'for f in "$@"; do case "$f" in *.pt|*.pth|*.safetensors|*.sqlite3|*.glb|*.ply) echo "refusing $f"; exit 1;; esac; done' --
        language: system
        files: .
